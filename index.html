<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One Piece - נחש את הדמות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --parchment: #f1e2c4;
  --parchment-dark: #d9c39a;
  --parchment-darker: #b89a6a;
  --ink: #2b1810;
  --ink-soft: #5a3a24;
  --gold: #c9a44c;
  --gold-dark: #8a6a1f;
  --red: #a8261d;
  --red-dark: #6e150e;
  --correct: #2f7d32;
  --correct-dark: #1b4d1e;
  --partial: #c98a1a;
  --wrong: #7a2a22;
  --wrong-dark: #4d1813;
}

html, body {
  margin: 0;
  padding: 0;
  color: var(--ink);
  font-family: "Rubik", "Segoe UI", Arial, sans-serif;
  font-weight: 500;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(184,154,106,0.5), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(138,106,31,0.4), transparent 60%),
    repeating-linear-gradient(135deg, rgba(120,80,40,0.05) 0 2px, transparent 2px 7px),
    linear-gradient(180deg, #f1e2c4 0%, #e6d2a8 100%);
  color-scheme: light;
}

header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 4px, transparent 4px 8px),
    linear-gradient(180deg, #6e150e 0%, #a8261d 60%, #8a1a13 100%);
  color: var(--parchment);
  border-bottom: 6px double var(--gold);
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
}

.lang-toggle {
  background: rgba(0,0,0,0.35);
  color: var(--gold);
  border: 2px solid var(--gold);
  padding: 7px 14px;
  border-radius: 20px;
  font-family: "Rubik", sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background 0.15s, transform 0.08s;
  justify-self: start;
  min-width: 48px;
}

.lang-toggle:hover { background: rgba(0,0,0,0.55); }
.lang-toggle:active { transform: scale(0.95); }

header h1 {
  margin: 0;
  font-family: "Pirata One", "Rubik", serif;
  font-size: 36px;
  letter-spacing: 2px;
  color: var(--gold);
  text-shadow: 2px 2px 0 #2b0a07, 0 0 18px rgba(201,164,76,0.6);
  font-weight: 400;
  text-align: center;
  line-height: 1.1;
}

button.primary {
  background: linear-gradient(180deg, #f1d77a 0%, #c9a44c 60%, #8a6a1f 100%);
  color: var(--ink);
  border: 2px solid var(--ink);
  padding: 10px 22px;
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
  font-size: 15px;
  font-family: "Rubik", sans-serif;
  letter-spacing: 1px;
  box-shadow: 0 3px 0 #5a3a18, 0 4px 10px rgba(0,0,0,0.35);
  transition: transform 0.08s, box-shadow 0.08s;
}

button.primary:hover { filter: brightness(1.07); }

button.primary:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #5a3a18, 0 2px 4px rgba(0,0,0,0.35);
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 20px 40px;
}

.search-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  align-items: stretch;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.crew-filter {
  padding: 0 16px;
  border-radius: 6px;
  border: 2px solid var(--ink);
  background: linear-gradient(180deg, #f1d77a 0%, #c9a44c 100%);
  color: var(--ink);
  font-family: "Rubik", sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  outline: none;
  box-shadow: 0 2px 0 var(--gold-dark);
  min-width: 180px;
  max-width: 240px;
}

.crew-filter:hover { filter: brightness(1.05); }
.crew-filter:focus { border-color: var(--red); }

@media (max-width: 600px) {
  .search-row { flex-direction: column; }
  .crew-filter { min-width: 0; max-width: none; padding: 10px 16px; }
}

#searchInput {
  width: 100%;
  padding: 14px 18px;
  border-radius: 6px;
  border: 2px solid var(--ink);
  background: var(--parchment);
  color: var(--ink);
  font-size: 17px;
  font-family: "Rubik", sans-serif;
  font-weight: 500;
  outline: none;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.15), 0 2px 0 var(--gold-dark);
}

#searchInput::placeholder { color: var(--ink-soft); opacity: 0.7; }

#searchInput:focus {
  border-color: var(--red);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.15), 0 0 0 3px rgba(168,38,29,0.25);
}

.suggestions {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  position: absolute;
  z-index: 100;
  right: 0;
  left: 0;
  background: var(--parchment);
  border: 2px solid var(--ink);
  border-radius: 6px;
  max-height: 480px;
  overflow-y: auto;
  display: none;
  box-shadow: 0 6px 18px rgba(0,0,0,0.3);
}

.suggestions.show { display: block; }

.suggestions li {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px dashed var(--parchment-darker);
  font-family: "Rubik", sans-serif;
  font-size: 17px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 14px;
  user-select: none;
}

.suggestions li:last-child { border-bottom: none; }

.suggestions li:hover,
.suggestions li.active {
  background: var(--gold);
  color: var(--ink);
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-family: "Rubik", sans-serif;
  font-size: 32px;
  color: #fff;
  border: 3px solid var(--ink);
  flex-shrink: 0;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  overflow: hidden;
  image-rendering: auto;
}

.suggestions .li-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: start;
}

.suggestions .li-text .he {
  font-family: "Rubik", sans-serif;
  font-size: 18px;
  font-weight: 600;
}

.suggestions .li-text .en {
  font-size: 14px;
  color: var(--ink-soft);
  font-family: "Rubik", sans-serif;
  font-weight: 500;
}

.status {
  margin: 14px 0;
  padding: 14px 18px;
  border-radius: 6px;
  background: var(--parchment-dark);
  border: 2px solid var(--ink);
  font-weight: 600;
  min-height: 22px;
  color: var(--ink);
  text-align: center;
  font-family: "Rubik", sans-serif;
  font-size: 16px;
  box-shadow: 0 2px 0 var(--gold-dark);
}

.status.win {
  background: linear-gradient(180deg, #3fa244 0%, #2f7d32 100%);
  color: #fff;
  border-color: #1b4d1e;
  text-shadow: 1px 1px 0 #1b4d1e;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin: 14px 0;
  font-size: 13px;
  color: var(--ink-soft);
  justify-content: center;
  font-family: "Rubik", sans-serif;
  font-weight: 500;
}

.legend-item { display: inline-flex; align-items: center; gap: 6px; }

.swatch {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 3px;
  border: 1px solid var(--ink);
}

.swatch.correct { background: var(--correct); }
.swatch.partial { background: var(--partial); }
.swatch.wrong { background: var(--wrong); }

.table-wrap {
  overflow-x: auto;
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 6px),
    var(--parchment);
  border: 3px solid var(--ink);
  border-radius: 8px;
  padding: 12px;
  box-shadow: inset 0 0 30px rgba(120,80,30,0.25), 0 4px 14px rgba(0,0,0,0.25);
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 6px;
}

th, td {
  padding: 12px 8px;
  text-align: center;
  font-size: 14px;
  border-radius: 5px;
  font-family: "Rubik", sans-serif;
}

th {
  background: linear-gradient(180deg, #2b1810 0%, #5a3a24 100%);
  color: var(--gold);
  font-weight: 700;
  font-family: "Rubik", sans-serif;
  font-size: 16px;
  letter-spacing: 0.5px;
  border: 2px solid var(--gold-dark);
  text-shadow: 1px 1px 0 #000;
}

td {
  background: var(--wrong);
  color: #fff;
  vertical-align: middle;
  transition: background 0.3s, transform 0.2s;
  border: 2px solid var(--wrong-dark);
  font-weight: 600;
  animation: dropIn 0.35s ease-out;
}

@keyframes dropIn {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

td.correct {
  background: linear-gradient(180deg, #3fa244 0%, #2f7d32 100%);
  border-color: var(--correct-dark);
  text-shadow: 1px 1px 0 var(--correct-dark);
}

td.partial {
  background: linear-gradient(180deg, #e8b13a 0%, #c98a1a 100%);
  color: var(--ink);
  border-color: #8a5a10;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
}

td.wrong {
  background: linear-gradient(180deg, #a8261d 0%, #7a2a22 100%);
  border-color: var(--wrong-dark);
  text-shadow: 1px 1px 0 var(--wrong-dark);
}

td.name {
  background: linear-gradient(180deg, #f1d77a 0%, #c9a44c 100%);
  color: var(--ink);
  font-weight: 700;
  font-family: "Rubik", sans-serif;
  font-size: 15px;
  border-color: var(--gold-dark);
  letter-spacing: 0.3px;
}

td.name .row-flex {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}

td.name .avatar {
  width: 64px;
  height: 64px;
  font-size: 26px;
  border-width: 2px;
}

.arrow {
  display: inline-block;
  margin-inline-start: 6px;
  font-size: 18px;
  font-weight: bold;
}

/* Smooth horizontal scroll on mobile */
.table-wrap { -webkit-overflow-scrolling: touch; }

/* ===== Mobile (<=700px) ===== */
@media (max-width: 700px) {
  header {
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "lang newgame"
      "title title";
    gap: 10px;
    padding: 14px 14px 16px;
  }
  .lang-toggle { grid-area: lang; padding: 6px 12px; font-size: 12px; min-width: 44px; }
  #newGameBtn { grid-area: newgame; }
  header h1 { grid-area: title; font-size: 24px; letter-spacing: 1px; }

  button.primary { padding: 8px 16px; font-size: 14px; }
  main { padding: 14px 10px 30px; }
  #searchInput { padding: 12px 14px; font-size: 16px; }
  .crew-filter { font-size: 14px; padding: 10px 14px; }
  .status { padding: 10px 14px; font-size: 14px; }
  .legend { gap: 10px; font-size: 11px; }
  .suggestions { max-height: 60vh; }
  .suggestions li { padding: 10px 10px; gap: 12px; }
  .avatar { width: 72px; height: 72px; font-size: 28px; border-width: 2px; }

  /* Convert table to cards */
  .table-wrap { padding: 0; background: transparent; border: none; box-shadow: none; overflow: visible; }
  table { border-spacing: 0; }
  thead { display: none; }
  tbody { display: block; }
  tbody tr {
    display: block;
    margin-bottom: 14px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    overflow: hidden;
    background: var(--parchment);
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    animation: dropIn 0.35s ease-out;
  }
  tbody td {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-radius: 0;
    border: none;
    border-bottom: 1px solid rgba(0,0,0,0.18);
    font-size: 14px;
    text-align: end;
    animation: none;
    text-shadow: none;
  }
  tbody td:last-child { border-bottom: none; }
  tbody td::before {
    content: attr(data-label);
    font-weight: 700;
    color: var(--ink);
    margin-inline-end: 12px;
    font-size: 13px;
    opacity: 0.85;
  }
  tbody td.correct,
  tbody td.partial,
  tbody td.wrong {
    color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  }
  tbody td.partial { color: var(--ink); text-shadow: none; }
  tbody td.correct::before,
  tbody td.partial::before,
  tbody td.wrong::before { color: rgba(255,255,255,0.95); opacity: 1; }
  tbody td.partial::before { color: var(--ink); }

  tbody td.name {
    justify-content: center;
    font-size: 17px;
    padding: 12px 14px;
    background: linear-gradient(180deg, #f1d77a 0%, #c9a44c 100%);
    border-bottom: 2px solid var(--gold-dark);
  }
  tbody td.name::before { content: none; }
  tbody td.name .row-flex { gap: 12px; }
  tbody td.name .avatar { width: 64px; height: 64px; font-size: 26px; border-width: 2px; }
}

@media (max-width: 420px) {
  header h1 { font-size: 20px; }
  tbody td { font-size: 13px; padding: 9px 12px; }
  tbody td::before { font-size: 12px; }
  tbody td.name { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <button id="langToggleBtn" class="lang-toggle">EN</button>
  <h1 id="appTitle">נחש את דמות ה-One Piece</h1>
  <button id="newGameBtn" class="primary">משחק חדש</button>
</header>

<main>
  <div class="search-row">
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="הקלד שם דמות..." autocomplete="off" />
      <ul id="suggestions" class="suggestions"></ul>
    </div>
    <select id="crewFilter" class="crew-filter"></select>
  </div>

  <div class="status" id="status"></div>

  <div class="legend" id="legend"></div>

  <div class="table-wrap">
    <table id="guessTable">
      <thead>
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="guessBody"></tbody>
    </table>
  </div>
</main>

<script>
/* ============================================================
   ===== להוסיף דמות חדשה? הוסף אובייקט למערך CHARACTERS =====
   ============================================================

   מבנה דמות:
   {
     name: "שם באנגלית",              // חובה - שם ייחודי באנגלית
     he:   "שם בעברית",               // חובה - שם בעברית לחיפוש
     img:  "URL לתמונה (אופציונלי)",   // ריק = יציג אווטר עם אות
     gender: "Male" / "Female",
     height: 180,                     // בסנטימטרים
     haki: ["Observation","Armament","Conqueror"],  // ריק [] = אין האקי
     devilFruit: "None" / "Paramecia" / "Logia" / "Zoan" / "Mythical Zoan" / "Ancient Zoan",
     crew: "שם הצוות באנגלית",         // למשל "Straw Hat Pirates" או "None"
     firstArc: "שם הארק באנגלית"       // למשל "Marineford" או "Skypiea"
   }

   ערכים אפשריים לארקים: Romance Dawn, Orange Town, Syrup Village,
   Baratie, Arlong Park, Loguetown, Reverse Mountain, Whisky Peak,
   Little Garden, Drum Island, Alabasta, Jaya, Skypiea,
   Long Ring Long Land, Water 7, Enies Lobby, Thriller Bark,
   Sabaody, Amazon Lily, Impel Down, Marineford, Post-War,
   Fishman Island, Punk Hazard, Dressrosa, Zou, Whole Cake Island,
   Reverie, Wano, Egghead, Elbaf

   טיפ: לתמונות, אפשר להעלות תמונה לכתובת כמו imgur ולשים את ה-URL.
   אם תשאיר img ריק, יוצג אווטר צבעוני עם האות הראשונה של השם.
   ============================================================ */

const CHARACTERS = [
  {name:"Monkey D. Luffy",he:"מאנקי די לופי",img:"https://www.slashfilm.com/img/gallery/one-piece-monkey-d-luffys-family-tree-explained/intro-1751306708.jpg",gender:"Male",height:174,haki:["Observation","Armament","Conqueror"],devilFruit:"Mythical Zoan",crew:"Straw Hat Pirates",firstArc:"Romance Dawn"},
  {name:"Roronoa Zoro",he:"רורונואה זורו",img:"https://static0.srcdn.com/wordpress/wp-content/uploads/2022/03/roronoa-zoro.jpg",gender:"Male",height:181,haki:["Observation","Armament","Conqueror"],devilFruit:"None",crew:"Straw Hat Pirates",firstArc:"Romance Dawn"},

  {name:"Sanji",he:"סאנג'י",img:"https://static0.gamerantimages.com/wordpress/wp-content/uploads/2025/10/one-piece-sanji-stronger-than-zoro-oda.png",gender:"Male",height:180,haki:["Observation","Armament"],devilFruit:"None",crew:"Straw Hat Pirates",firstArc:"Baratie"},
  {name:"Tony Tony Chopper",he:"טוני טוני צ'ופר",img:"https://images4.alphacoders.com/138/thumb-1920-1381544.png",gender:"Male",height:90,haki:[],devilFruit:"Zoan",crew:"Straw Hat Pirates",firstArc:"Drum Island"},
  {name:"Nico Robin",he:"ניקו רובין",img:"https://pbs.twimg.com/media/FLmHj6PXwAIflRx.jpg",gender:"Female",height:188,haki:[],devilFruit:"Paramecia",crew:"Straw Hat Pirates",firstArc:"Whisky Peak"},
  {name:"Franky",he:"פרנקי",img:"https://a.storyblok.com/f/178900/920x519/b53bf39bea/one-piece-franky.jpg",gender:"Male",height:240,haki:[],devilFruit:"None",crew:"Straw Hat Pirates",firstArc:"Water 7"},
  {name:"Brook",he:"ברוק",img:"https://images.mein-mmo.de/medien/2025/04/one-piece-brook-1.jpg",gender:"Male",height:277,haki:[],devilFruit:"Paramecia",crew:"Straw Hat Pirates",firstArc:"Thriller Bark"},
  {name:"Jinbe",he:"ג'ינבי",img:"https://practicaltyping.com/wp-content/uploads/2018/09/jinbe.png",gender:"Male",height:301,haki:["Observation","Armament"],devilFruit:"None",crew:"Straw Hat Pirates",firstArc:"Impel Down"},

  {name:"Shanks",he:"שאנקס",img:"https://i.redd.it/uumqo5hxu2qc1.jpeg",gender:"Male",height:199,haki:["Observation","Armament","Conqueror"],devilFruit:"None",crew:"Red Hair Pirates",firstArc:"Romance Dawn"},
  {name:"Benn Beckman",he:"בן בקמן",img:"https://i.pinimg.com/736x/7c/3b/4d/7c3b4d8a999e09e6eb5ee7c64753762a.jpg",gender:"Male",height:206,haki:["Armament"],devilFruit:"None",crew:"Red Hair Pirates",firstArc:"Romance Dawn"},
  {name:"Yasopp",he:"יאסופ",img:"https://i.pinimg.com/736x/84/ef/34/84ef3472b225163c2dd8075099daf47b.jpg",gender:"Male",height:187,haki:["Observation"],devilFruit:"None",crew:"Red Hair Pirates",firstArc:"Romance Dawn"},
  {name:"Lucky Roux",he:"לאקי רו",img:"https://i.pinimg.com/736x/de/80/b3/de80b3b03e76dffd09c05fae5c3c5f96.jpg",gender:"Male",height:194,haki:[],devilFruit:"None",crew:"Red Hair Pirates",firstArc:"Romance Dawn"},

  {name:"Edward Newgate",he:"וויטבירד",img:"https://images.bigbadtoystore.com/images/product/170294/96c06737-3624-411f-9ace-84463fa88d8c/original.jpg",gender:"Male",height:666,haki:["Armament","Conqueror"],devilFruit:"Paramecia",crew:"Whitebeard Pirates",firstArc:"Jaya"},
  {name:"Marco",he:"מארקו",img:"https://ricedigital.co.uk/wp-content/uploads/2023/06/marco.jpg",gender:"Male",height:203,haki:["Armament"],devilFruit:"Mythical Zoan",crew:"Whitebeard Pirates",firstArc:"Sabaody"},
  {name:"Portgas D. Ace",he:"פורטגאס די אייס",img:"https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/i/d96bb958-4e6c-4ce0-9447-fbe226fbbecf/dft30jp-04069991-89bb-4fe1-8003-1c7a8e5af628.jpg",gender:"Male",height:185,haki:["Observation","Armament","Conqueror"],devilFruit:"Logia",crew:"Whitebeard Pirates",firstArc:"Alabasta"},

  {name:"Bariete",he:"באריטה",img:"",gender:"Male",height:280,haki:[],devilFruit:"None",crew:"Mink Tribe",firstArc:"Zou"},

  {name:"Dr. Kureha",he:"ד\"ר קורהה",img:"",gender:"Female",height:192,haki:[],devilFruit:"None",crew:"None",firstArc:"Drum Island"},
  {name:"Dr. Hiriluk",he:"ד\"ר הירילוק",img:"",gender:"Male",height:290,haki:[],devilFruit:"None",crew:"None",firstArc:"Drum Island"},

  {name:"Scopper Gaban",he:"סקופר גבן",img:"",gender:"Male",height:230,haki:[],devilFruit:"None",crew:"Roger Pirates",firstArc:"Loguetown"}
];

let target = null;
let guessedNames = new Set();
let guessHistory = [];
let activeSuggestion = -1;
let LANG = "he";
try { LANG = localStorage.getItem("op-lang") || "he"; } catch(e) {}

const I18N = {
  he: {
    title: "נחש את דמות ה-One Piece",
    newGame: "משחק חדש",
    placeholder: "הקלד שם דמות...",
    legendCorrect: "תואם",
    legendPartial: "תואם חלקית",
    legendWrong: "לא תואם",
    legendUp: "▲ גבוה/מאוחר יותר",
    legendDown: "▼ נמוך/מוקדם יותר",
    colCharacter: "דמות",
    colGender: "מין",
    colDevilFruit: "פרי שטן",
    colHaki: "סוגי האקי",
    colCrew: "צוות",
    colFirstArc: "ארק ראשון",
    colHeight: "גובה",
    startMsg: "משחק חדש התחיל. נחש את הדמות!",
    win: name => `🎉 ניצחת! הדמות הייתה ${name}. ניחושים: ${guessedNames.size}`,
    guesses: n => `ניחושים: ${n}`,
    notFound: name => `דמות לא נמצאה: ${name}`,
    already: name => `כבר ניחשת את ${name}`,
    cm: "ס\"מ",
    male: "זכר", female: "נקבה",
    none: "אין",
    Paramecia: "פרמיסיה", Logia: "לוגיה", Zoan: "זואן",
    "Mythical Zoan": "זואן מיתי", "Ancient Zoan": "זואן קדום",
    Observation: "תצפיתי", Armament: "חימוש", Conqueror: "כיבוש",
    langBtn: "EN",
    allCrews: "כל הצוותים"
  },
  en: {
    title: "Guess the One Piece Character",
    newGame: "New Game",
    placeholder: "Type a character name...",
    legendCorrect: "Match",
    legendPartial: "Partial match",
    legendWrong: "No match",
    legendUp: "▲ Taller / Later arc",
    legendDown: "▼ Shorter / Earlier arc",
    colCharacter: "Character",
    colGender: "Gender",
    colDevilFruit: "Devil Fruit",
    colHaki: "Haki Types",
    colCrew: "Crew",
    colFirstArc: "First Arc",
    colHeight: "Height",
    startMsg: "New game started. Guess the character!",
    win: name => `🎉 You won! The character was ${name}. Guesses: ${guessedNames.size}`,
    guesses: n => `Guesses: ${n}`,
    notFound: name => `Character not found: ${name}`,
    already: name => `You already guessed ${name}`,
    cm: "cm",
    male: "Male", female: "Female",
    none: "None",
    Paramecia: "Paramecia", Logia: "Logia", Zoan: "Zoan",
    "Mythical Zoan": "Mythical Zoan", "Ancient Zoan": "Ancient Zoan",
    Observation: "Observation", Armament: "Armament", Conqueror: "Conqueror",
    langBtn: "עב",
    allCrews: "All Crews"
  }
};

function t(key) { return I18N[LANG][key]; }
function displayName(char) { return LANG === "he" ? (char.he || char.name) : char.name; }

const ARC_ORDER = [
  "Romance Dawn","Orange Town","Syrup Village","Baratie","Arlong Park",
  "Loguetown","Reverse Mountain","Whisky Peak","Little Garden","Drum Island",
  "Alabasta","Jaya","Skypiea","Long Ring Long Land","Water 7",
  "Enies Lobby","Thriller Bark","Sabaody","Amazon Lily","Impel Down",
  "Marineford","Post-War","Fishman Island","Punk Hazard","Dressrosa",
  "Zou","Whole Cake Island","Reverie","Wano","Egghead","Elbaf"
];
function arcIndex(name) {
  const i = ARC_ORDER.indexOf(name);
  return i === -1 ? 999 : i;
}

const searchInput = document.getElementById("searchInput");
const suggestionsEl = document.getElementById("suggestions");
const guessBody = document.getElementById("guessBody");
const statusEl = document.getElementById("status");
const newGameBtn = document.getElementById("newGameBtn");
const langToggleBtn = document.getElementById("langToggleBtn");
const appTitle = document.getElementById("appTitle");
const legendEl = document.getElementById("legend");
const tableHeadEl = document.getElementById("tableHead");
const crewFilterEl = document.getElementById("crewFilter");

function hashColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  const palette = [
    "#a8261d","#6e150e","#c9a44c","#8a6a1f","#2f7d32","#1b4d1e",
    "#103a5a","#1e5c8a","#6a3a8a","#8a3a6a","#3a6a8a","#8a4a1a",
    "#5a2a8a","#2a8a5a","#8a2a4a","#4a8a2a"
  ];
  return palette[h % palette.length];
}

function avatarHTML(char) {
  if (char.img && char.img.trim()) {
    return `<div class="avatar" style="background-image:url('${char.img}')"></div>`;
  }
  const letter = (char.name || "?").trim()[0].toUpperCase();
  const color = hashColor(char.name);
  return `<div class="avatar" style="background:${color}">${letter}</div>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function startNewGame() {
  target = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
  guessedNames.clear();
  guessHistory = [];
  guessBody.innerHTML = "";
  statusEl.textContent = t("startMsg");
  statusEl.classList.remove("win");
  searchInput.value = "";
  searchInput.disabled = false;
  searchInput.focus();
  hideSuggestions();
  console.log("Target (debug):", target.name, "/", target.he);
}

function hideSuggestions() {
  suggestionsEl.classList.remove("show");
  suggestionsEl.innerHTML = "";
  activeSuggestion = -1;
}

function matchesQuery(char, q) {
  const en = (char.name || "").toLowerCase();
  const he = (char.he || "");
  return en.includes(q) || he.includes(q);
}

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  const crew = crewFilterEl.value;
  const base = CHARACTERS.filter(c =>
    !guessedNames.has(c.name) &&
    (!crew || c.crew === crew)
  );
  const locale = LANG === "he" ? "he" : "en";
  const sorted = [...base].sort((a, b) => {
    const aName = LANG === "he" ? (a.he || a.name) : a.name;
    const bName = LANG === "he" ? (b.he || b.name) : b.name;
    return aName.localeCompare(bName, locale, { sensitivity: "base" });
  });
  const matches = q
    ? sorted.filter(c => matchesQuery(c, q)).slice(0, 50)
    : sorted.slice(0, 50);
  renderSuggestions(matches);
}

function populateCrewFilter() {
  const currentValue = crewFilterEl.value;
  const crews = [...new Set(CHARACTERS.map(c => c.crew))].sort();
  const counts = {};
  for (const c of CHARACTERS) counts[c.crew] = (counts[c.crew] || 0) + 1;
  crewFilterEl.innerHTML =
    `<option value="">${t("allCrews")} (${CHARACTERS.length})</option>` +
    crews.map(cr => `<option value="${escapeHtml(cr)}">${escapeHtml(cr)} (${counts[cr]})</option>`).join("");
  crewFilterEl.value = currentValue || "";
}

function renderSuggestions(list) {
  if (list.length === 0) { hideSuggestions(); return; }
  suggestionsEl.innerHTML = list.map((c, i) => {
    const primary = LANG === "he" ? (c.he || c.name) : c.name;
    const secondary = LANG === "he" ? c.name : (c.he || "");
    return `
    <li data-name="${escapeHtml(c.name)}" data-idx="${i}">
      ${avatarHTML(c)}
      <div class="li-text">
        <span class="he">${escapeHtml(primary)}</span>
        <span class="en">${escapeHtml(secondary)}</span>
      </div>
    </li>`;
  }).join("");
  suggestionsEl.classList.add("show");
  activeSuggestion = -1;
  // Use mousedown to fire before input blur
  suggestionsEl.querySelectorAll("li").forEach(li => {
    li.addEventListener("mousedown", e => {
      e.preventDefault();
      submitGuess(li.dataset.name);
    });
  });
}

function compareHaki(guessHaki, targetHaki) {
  const gSet = new Set(guessHaki);
  const tSet = new Set(targetHaki);
  const allTypes = ["Observation","Armament","Conqueror"];
  let matches = 0;
  for (const type of allTypes) if (gSet.has(type) && tSet.has(type)) matches++;
  if (gSet.size === 0 && tSet.size === 0) return "correct";
  if (gSet.size === tSet.size && [...gSet].every(x => tSet.has(x))) return "correct";
  if (matches > 0) return "partial";
  return "wrong";
}

function hakiLabel(haki) {
  if (!haki || haki.length === 0) return t("none");
  return haki.map(h => t(h) || h).join(", ");
}

function dfLabel(df) {
  if (df === "None") return t("none");
  return t(df) || df;
}

function genderLabel(g) {
  return g === "Male" ? t("male") : g === "Female" ? t("female") : g;
}

function submitGuess(name) {
  const guess = CHARACTERS.find(c => c.name === name);
  if (!guess) { statusEl.textContent = t("notFound")(name); return; }
  if (guessedNames.has(guess.name)) { statusEl.textContent = t("already")(displayName(guess)); return; }
  guessedNames.add(guess.name);
  guessHistory.push(guess);
  renderGuess(guess);
  searchInput.value = "";
  hideSuggestions();
  if (guess.name === target.name) {
    statusEl.textContent = t("win")(displayName(target));
    statusEl.classList.add("win");
    searchInput.disabled = true;
  } else {
    statusEl.textContent = t("guesses")(guessedNames.size);
    statusEl.classList.remove("win");
  }
}

function renderGuess(guess) {
  const tr = document.createElement("tr");
  const cells = [];
  const nameHtml = `<div class="row-flex">${avatarHTML(guess)}<span>${escapeHtml(displayName(guess))}</span></div>`;
  cells.push({ html: nameHtml, cls: "name" });
  cells.push({ text: genderLabel(guess.gender), cls: guess.gender === target.gender ? "correct" : "wrong", label: t("colGender") });
  cells.push({ text: dfLabel(guess.devilFruit), cls: guess.devilFruit === target.devilFruit ? "correct" : "wrong", label: t("colDevilFruit") });
  cells.push({ text: hakiLabel(guess.haki), cls: compareHaki(guess.haki, target.haki), label: t("colHaki") });
  cells.push({ text: guess.crew, cls: guess.crew === target.crew ? "correct" : "wrong", label: t("colCrew") });
  let arcText = guess.firstArc;
  let arcCls = "wrong";
  if (guess.firstArc === target.firstArc) {
    arcCls = "correct";
  } else {
    const gi = arcIndex(guess.firstArc);
    const ti = arcIndex(target.firstArc);
    if (ti > gi) arcText += ' <span class="arrow">▲</span>';
    else if (ti < gi) arcText += ' <span class="arrow">▼</span>';
  }
  cells.push({ html: arcText, cls: arcCls, label: t("colFirstArc") });
  let heightText = guess.height + " " + t("cm");
  let heightCls = "wrong";
  if (guess.height === target.height) heightCls = "correct";
  else if (target.height > guess.height) heightText += ' <span class="arrow">▲</span>';
  else heightText += ' <span class="arrow">▼</span>';
  cells.push({ html: heightText, cls: heightCls, label: t("colHeight") });
  for (const cell of cells) {
    const td = document.createElement("td");
    td.className = cell.cls || "";
    if (cell.label) td.setAttribute("data-label", cell.label);
    if (cell.html) td.innerHTML = cell.html;
    else td.textContent = cell.text;
    tr.appendChild(td);
  }
  guessBody.prepend(tr);
}

function rerenderAllGuesses() {
  guessBody.innerHTML = "";
  // history is in order of guessing; renderGuess prepends so iterate forward
  for (const g of guessHistory) renderGuess(g);
}

function applyLanguage() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
  appTitle.textContent = t("title");
  newGameBtn.textContent = t("newGame");
  searchInput.placeholder = t("placeholder");
  langToggleBtn.textContent = t("langBtn");
  legendEl.innerHTML = `
    <span class="legend-item"><span class="swatch correct"></span> ${t("legendCorrect")}</span>
    <span class="legend-item"><span class="swatch partial"></span> ${t("legendPartial")}</span>
    <span class="legend-item"><span class="swatch wrong"></span> ${t("legendWrong")}</span>
    <span class="legend-item">${t("legendUp")}</span>
    <span class="legend-item">${t("legendDown")}</span>`;
  tableHeadEl.innerHTML = `
    <th>${t("colCharacter")}</th>
    <th>${t("colGender")}</th>
    <th>${t("colDevilFruit")}</th>
    <th>${t("colHaki")}</th>
    <th>${t("colCrew")}</th>
    <th>${t("colFirstArc")}</th>
    <th>${t("colHeight")}</th>`;
  populateCrewFilter();
  // Re-render existing guesses with new language
  rerenderAllGuesses();
  // Update status text if game still in progress / won
  if (target) {
    if (searchInput.disabled) {
      statusEl.textContent = t("win")(displayName(target));
    } else if (guessedNames.size > 0) {
      statusEl.textContent = t("guesses")(guessedNames.size);
    } else {
      statusEl.textContent = t("startMsg");
    }
  }
}

langToggleBtn.addEventListener("click", () => {
  LANG = LANG === "he" ? "en" : "he";
  try { localStorage.setItem("op-lang", LANG); } catch(e) {}
  applyLanguage();
});

searchInput.addEventListener("input", e => showSuggestions(e.target.value));
searchInput.addEventListener("focus", e => showSuggestions(e.target.value));
crewFilterEl.addEventListener("change", () => {
  searchInput.focus();
  showSuggestions(searchInput.value);
});

searchInput.addEventListener("keydown", e => {
  const items = suggestionsEl.querySelectorAll("li");
  if (e.key === "ArrowDown" && items.length) {
    e.preventDefault();
    activeSuggestion = (activeSuggestion + 1) % items.length;
    updateActive(items);
  } else if (e.key === "ArrowUp" && items.length) {
    e.preventDefault();
    activeSuggestion = (activeSuggestion - 1 + items.length) % items.length;
    updateActive(items);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeSuggestion >= 0 && items[activeSuggestion]) submitGuess(items[activeSuggestion].dataset.name);
    else if (items.length > 0) submitGuess(items[0].dataset.name);
  } else if (e.key === "Escape") hideSuggestions();
});

function updateActive(items) {
  items.forEach((li, i) => {
    li.classList.toggle("active", i === activeSuggestion);
    if (i === activeSuggestion) li.scrollIntoView({ block: "nearest" });
  });
}

document.addEventListener("mousedown", e => {
  if (!e.target.closest(".search-wrap")) hideSuggestions();
});

newGameBtn.addEventListener("click", startNewGame);
applyLanguage();
startNewGame();
</script>
